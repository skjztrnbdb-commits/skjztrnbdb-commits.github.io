<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b12">
<link rel="manifest" href="manifest.json">
<title>Button</title>
<style>
  :root {
    --hue: 200;
    --bg: hsl(var(--hue) 30% 6%);
    --btn: hsl(var(--hue) 80% 55%);
    --btn2: hsl(calc(var(--hue) + 40) 90% 65%);
    --glow: hsl(var(--hue) 90% 60% / .55);
    --text: hsl(var(--hue) 30% 92%);
    --dim: hsl(var(--hue) 20% 60%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
    transition: background-color .6s;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
    will-change: transform;
  }
  #score {
    font-size: clamp(40px, 12vw, 64px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-shadow: 0 0 24px var(--glow);
    transition: transform .08s;
  }
  #score.bump { transform: scale(1.06); }
  #title {
    margin-top: 2px; height: 20px;
    font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--btn2); opacity: .85;
  }
  #auto {
    margin-top: 4px; height: 22px;
    font-size: 16px; color: var(--dim);
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity .8s;
  }
  #auto.on { opacity: 1; }
  #prog {
    margin-top: 6px; width: min(60vw, 260px); height: 4px; border-radius: 2px;
    background: rgb(255 255 255 / .1); overflow: hidden;
  }
  #prog i { display: block; height: 100%; width: 0; background: var(--btn2); border-radius: 2px; transition: width .2s; }
  #prog.near i { animation: near .6s ease-in-out infinite alternate; }
  @keyframes near { from { box-shadow: 0 0 4px var(--btn2); filter: brightness(1); } to { box-shadow: 0 0 14px var(--btn2); filter: brightness(1.6); } }
  #rush {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 120px); text-align: center; pointer-events: none;
    font-size: clamp(40px, 14vw, 80px); font-weight: 900; color: #fff; line-height: 1;
    text-shadow: 0 0 30px #ff5c8a, 0 0 60px #ff5c8a; opacity: 0; transition: opacity .3s;
  }
  #rush.on { opacity: 1; }
  #rush small { display: block; font-size: .2em; letter-spacing: .3em; color: #ff5c8a; }
  #combo {
    margin-top: 4px; height: 26px;
    font-size: 18px; font-weight: 700;
    color: var(--btn2);
    opacity: 0; transition: opacity .2s, transform .1s;
  }
  #combo.on { opacity: 1; }
  #groove {
    margin-top: 2px; height: 22px; font-size: 14px; font-weight: 700; letter-spacing: .06em;
    color: #ffd23f; opacity: 0; transition: opacity .3s;
  }
  #groove.on { opacity: 1; }
  #mid { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
  :root { --ox: 0px; --oy: 0px; --sz: 1; }
  #btn.moving { transition: transform .09s cubic-bezier(.2,.9,.3,1.4), background .6s, box-shadow .6s, translate .25s linear, scale .5s; }
  #btn { translate: var(--ox) var(--oy); scale: var(--sz); }
  #btn {
    width: calc(min(64vw, 300px) * var(--btnk, 1)); aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--btn2), var(--btn) 55%, hsl(var(--hue) 70% 35%) 100%);
    box-shadow: 0 0 60px var(--glow), 0 20px 40px rgb(0 0 0 / .5), inset 0 -12px 24px rgb(0 0 0 / .25), inset 0 8px 16px rgb(255 255 255 / .25);
    transform: scale(1);
    transition: transform .09s cubic-bezier(.2,.9,.3,1.4), background .6s, box-shadow .6s;
  }
  #btn { position: relative; }
  #btn::before, #btn::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
    opacity: 0; transition: opacity 1s;
  }
  #btn::before {
    inset: -16px;
    background: conic-gradient(from 0deg, transparent 0 40%, var(--btn2) 50%, transparent 60% 100%);
    -webkit-mask: radial-gradient(circle, transparent 0 calc(50% - 8px), #000 calc(50% - 7px));
    mask: radial-gradient(circle, transparent 0 calc(50% - 8px), #000 calc(50% - 7px));
    animation: spin 5s linear infinite;
  }
  #btn::after {
    inset: -30px;
    background: conic-gradient(from 180deg, transparent 0 30%, #fff 40%, transparent 50% 70%, var(--btn2) 80%, transparent 90% 100%);
    -webkit-mask: radial-gradient(circle, transparent 0 calc(50% - 5px), #000 calc(50% - 4px));
    mask: radial-gradient(circle, transparent 0 calc(50% - 5px), #000 calc(50% - 4px));
    animation: spin 9s linear infinite reverse;
  }
  body[data-lv="2"] #btn::before, body[data-lv="3"] #btn::before, body.lv4 #btn::before { opacity: .9; }
  body.lv4 #btn::after { opacity: .8; }
  #core {
    position: absolute; inset: 30%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff, var(--btn2) 40%, transparent 70%);
    opacity: 0; transition: opacity 1s;
  }
  body.lv6 #core { opacity: .9; animation: corepulse 1.4s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes corepulse { from { transform: scale(.85); } to { transform: scale(1.15); } }
  #btn.beat { animation: beat var(--beat, 2s) ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.03); } 24% { transform: scale(1); } 36% { transform: scale(1.02); } 48% { transform: scale(1); } }
  #btn.down, #btn.crit { animation: none; }
  body.golden #btn { background: radial-gradient(circle at 35% 30%, #fff7c2, #ffd23f 50%, #b8780a 100%); box-shadow: 0 0 90px #ffd23f, 0 20px 40px rgb(0 0 0 / .5), inset 0 -12px 24px rgb(0 0 0 / .25), inset 0 8px 16px rgb(255 255 255 / .35); }
  #hint {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: 28px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: rgb(255 255 255 / .85);
    opacity: 0; transition: opacity .5s;
  }
  #hint.on { opacity: 1; animation: hint 1.2s ease-in-out infinite alternate; }
  @keyframes hint { from { transform: scale(.96); } to { transform: scale(1.06); } }
  #btn.down { transform: scale(.9); transition-duration: .04s; }
  #stats {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 120px);
    transform: translateX(-50%) translateY(-10px); pointer-events: none;
    padding: 12px 18px; border-radius: 18px; width: min(92vw, 360px);
    background: rgb(0 0 0 / .55); backdrop-filter: blur(10px);
    font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px;
    opacity: 0; transition: opacity .25s, transform .25s;
  }
  #stats.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #stats div { display: flex; justify-content: space-between; gap: 12px; }
  #stats span:first-child { color: var(--dim); }
  #btn.crit { transform: scale(1.12); }
  #fx { position: fixed; inset: 0; pointer-events: none; }
  #bg { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  #toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 150px);
    transform: translateX(-50%) translateY(-20px); pointer-events: none;
    padding: 10px 18px; border-radius: 999px;
    background: rgb(255 255 255 / .12); backdrop-filter: blur(8px);
    color: #fff; font-size: 17px; font-weight: 700; white-space: nowrap;
    opacity: 0; transition: opacity .25s, transform .25s;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast b { color: #ffd23f; margin-right: 6px; }
  #banner {
    position: fixed; left: 0; right: 0; top: 34%;
    text-align: center; pointer-events: none;
    font-size: clamp(56px, 18vw, 120px); font-weight: 900;
    letter-spacing: -0.03em;
    color: #fff; text-shadow: 0 0 40px var(--glow), 0 0 80px var(--glow);
    opacity: 0; transform: scale(.6);
  }
  #banner small { display: block; font-size: .28em; letter-spacing: .25em; font-weight: 800; margin-top: 6px; }
  #banner.show { animation: banner 1.6s ease-out forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(.5); }
    15% { opacity: 1; transform: scale(1.1); }
    30% { transform: scale(1); }
    80% { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(1.05) translateY(-30px); }
  }
  #word {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 4;
    font-size: clamp(52px, 19vw, 130px); font-weight: 900; letter-spacing: -0.02em; line-height: 1;
    color: #fff; -webkit-text-stroke: 3px rgb(0 0 0 / .6);
    text-shadow: 0 0 30px var(--wc, #fff), 0 0 80px var(--wc, #fff), 0 8px 24px rgb(0 0 0 / .6);
    opacity: 0; transform: rotate(-6deg) scale(.3);
  }
  #word.show { animation: word .9s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes word {
    0% { opacity: 0; transform: rotate(-6deg) scale(.3); }
    18% { opacity: 1; transform: rotate(-6deg) scale(1.15); }
    36% { transform: rotate(-6deg) scale(1); }
    100% { opacity: 1; transform: rotate(-6deg) scale(1.04); }
  }
  #word span { display: inline-block; transition: transform .55s cubic-bezier(.3,.6,.4,1), opacity .5s; }
  #word.shatter span { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.5); opacity: 0; }
  #corner {
    position: fixed; right: 14px; top: calc(env(safe-area-inset-top) + 12px);
    display: flex; gap: 10px;
  }
  .ic {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgb(255 255 255 / .08); color: var(--dim);
    font-size: 17px; line-height: 1;
  }
  .ic:active { background: rgb(255 255 255 / .18); }
  #ask {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgb(0 0 0 / .6);
  }
  #ask.show { display: flex; }
  #ask div {
    background: hsl(var(--hue) 25% 12%); padding: 22px 26px; border-radius: 20px;
    display: flex; gap: 14px; font-size: 17px;
  }
  #ask button {
    border: 0; border-radius: 12px; padding: 10px 18px; font-size: 17px;
    background: rgb(255 255 255 / .1); color: var(--text);
  }
  #ask button.no { background: var(--btn); color: #000; font-weight: 700; }
  #slot {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 56px);
    transform: translateX(-50%) scale(.6); pointer-events: none;
    display: flex; gap: 8px; padding: 8px; border-radius: 18px;
    background: rgb(0 0 0 / .45); border: 2px solid rgb(255 255 255 / .18);
    opacity: 0; transition: opacity .25s, transform .25s;
  }
  #slot.on { opacity: 1; transform: translateX(-50%) scale(1); }
  #slot.win { border-color: #ffd23f; box-shadow: 0 0 30px #ffd23f; }
  #slot span {
    width: 52px; height: 60px; border-radius: 12px; display: grid; place-items: center;
    background: rgb(255 255 255 / .1); font-size: 30px; font-weight: 900; color: #fff;
  }
  #slot span.stop { background: rgb(255 255 255 / .22); }
  #white { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 5; }
  #white.on { opacity: 1; }
  #white.slow { transition: opacity 1.4s; }
  #orb {
    position: fixed; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%; display: none;
    background: radial-gradient(circle at 35% 30%, #fff7c2, #ffd23f 45%, #e08a00 100%);
    box-shadow: 0 0 30px #ffd23f, 0 0 70px rgb(255 210 63 / .6);
    animation: orbspin 1.2s ease-in-out infinite alternate;
  }
  #orb.show { display: block; }
  #orb.purple { background: radial-gradient(circle at 35% 30%, #f3d9ff, #b56cff 45%, #5a1aa8 100%); box-shadow: 0 0 30px #b56cff, 0 0 70px rgb(181 108 255 / .6); }
  #orb.blue { background: radial-gradient(circle at 35% 30%, #dff7ff, #4de1ff 45%, #0a6a8a 100%); box-shadow: 0 0 30px #4de1ff, 0 0 70px rgb(77 225 255 / .6); }
  #orb.red { background: radial-gradient(circle at 35% 30%, #ffd9e0, #ff5c8a 45%, #9a1030 100%); box-shadow: 0 0 30px #ff5c8a, 0 0 70px rgb(255 92 138 / .6); }
  @keyframes orbspin { from { transform: scale(.92) rotate(-6deg); } to { transform: scale(1.08) rotate(6deg); } }
  #frenzy {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 8px);
    text-align: center; pointer-events: none;
    font-size: 30px; font-weight: 900; letter-spacing: .12em;
    color: #ffd23f; text-shadow: 0 0 20px #ffb000;
    opacity: 0; transition: opacity .3s;
  }
  #frenzy.on { opacity: 1; animation: pulse .35s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
  body.frenzy #btn { animation: btnpulse .3s ease-in-out infinite alternate; box-shadow: 0 0 90px #ffd23f, 0 20px 40px rgb(0 0 0 / .5); }
  @keyframes btnpulse { from { filter: brightness(1) saturate(1); } to { filter: brightness(1.35) saturate(1.5); } }
</style>
</head>
<body>
<div id="stage">
  <div id="score">0</div>
  <div id="title"></div>
  <div id="auto"></div>
  <div id="prog"><i></i></div>
  <div id="combo"></div>
  <div id="groove"></div>
  <div id="mid"><div id="btn"><div id="core"></div><div id="hint">tap</div></div></div>
</div>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="slot"><span></span><span></span><span></span></div>
<div id="stats"></div>
<div id="banner"></div>
<div id="word"></div>
<div id="frenzy">FRENZY</div>
<div id="rush"></div>
<div id="white"></div>
<div id="orb"></div>
<div id="corner">
  <div class="ic" id="mute">♪</div>
  <div class="ic" id="reset">↺</div>
</div>
<div id="ask"><div><button class="no" id="askNo">Keep</button><button id="askYes">Start over</button></div></div>

<script>
'use strict';
// ------------------------------------------------------------ numbers
const THRESH = [100, 1000, 10000, 100000, 1e6, 1e7, 1e8, 1e9, 1e10, 1e11, 1e12, 1e13, 1e14, 1e15, 1e16, 1e17, 1e18, 1e19, 1e20, 1e21];
const levelOf = s => THRESH.filter(t => s >= t).length;
// NG+: every cycle makes it a little harder and a little richer
const ngK = () => 1 - 0.05 * Math.min(S.ng, 10);            // button size
const critChance = () => golden() ? 0.5 : Math.min(0.3, 0.1 + 0.02 * S.ng);
const perfectR = () => (golden() ? 2 : 1) * Math.max(0.05, 0.09 - 0.005 * S.ng);   // radius of the bullseye, share of the width
let goldenUntil = 0; const golden = () => performance.now() < goldenUntil;
const comboWin = () => performance.now() < chillUntil ? 2000 : Math.max(500, 900 - 50 * S.ng);   // ms before the combo drops
const ngPace = () => 1 / (1 + 0.1 * Math.min(S.ng, 10));    // orbs and events come sooner
const mmss = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
const TITLES = ['Spark', 'Ember', 'Flame', 'Blaze', 'Inferno', 'Star', 'Nova', 'Pulsar', 'Quasar', 'Galaxy', 'Cluster', 'Cosmos', 'Infinity', 'Beyond', 'Void', 'Aeon', 'Eternity', 'Singularity', 'Omega', 'Genesis', 'Absolute'];
const tapValue = lv => Math.round(Math.pow(10, lv * 0.8));   // 1, 6, 40, 250, 1600, 10k...
const autoRate = lv => lv < 2 ? 0 : Math.round(tapValue(lv) * 0.3);
const SUFFIX = ['', 'k', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e6) return n.toLocaleString('en-US').replace(/,/g, ' ');
  let i = 0; let v = n;
  while (v >= 1000 && i < SUFFIX.length - 1) { v /= 1000; i++; }
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toString()) + SUFFIX[i];
}

// ------------------------------------------------------------ state
const KEY = 'button.save';
let S = { score: 0, seen: Date.now(), muted: false, st: {}, ach: [] };
try { const j = localStorage.getItem(KEY); if (j) S = { ...S, ...JSON.parse(j) }; } catch {}
S.st = { taps: 0, crits: 0, jackpots: 0, charges: 0, maxCombo: 0, meteors: 0, days: 0, ...(S.st || {}) };
S.st.bestDays = Math.max(S.st.bestDays || 0, S.st.days || 0);
S.ach = S.ach || [];
if (!isFinite(S.score)) S.score = S.ok || 0;
S.ng = S.ng || 0; S.runTime = S.runTime || 0;   // cycle number and active seconds in this cycle
S.splits = S.splits || [];                          // best time to reach each level, seconds
S.run = { taps: 0, crits: 0, perfects: 0, maxCombo: 0, orbs: 0, ...(S.run || {}) };
let level = Math.min(levelOf(S.score), THRESH.length - 1);   // a save made at Absolute still ascends on load
let combo = 0, lastTap = 0, saveTimer = 0;
let frenzyUntil = 0, frenzyShown = false;
const inFrenzy = () => performance.now() < frenzyUntil;
function save() {
  if (!isFinite(S.score)) S.score = S.ok || 0; else S.ok = S.score;   // a broken number never reaches the disk
  S.seen = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
}

// ------------------------------------------------------------ dom
const $ = id => document.getElementById(id);
const stage = $('stage'), scoreEl = $('score'), autoEl = $('auto'), comboEl = $('combo'),
      btn = $('btn'), banner = $('banner'), fx = $('fx'), ctx = fx.getContext('2d'),
      orb = $('orb'), frenzyEl = $('frenzy'), toastEl = $('toast'),
      progEl = $('prog'), progBar = progEl.firstElementChild, rushEl = $('rush'),
      bg = $('bg'), bctx = bg.getContext('2d');
const root = document.documentElement.style;

function applyLevel(animate) {
  root.setProperty('--hue', String((200 + level * 47 + S.ng * 97) % 360));
  root.setProperty('--btnk', String(ngK()));
  $('title').textContent = TITLES[Math.min(level, TITLES.length - 1)] + (S.ng ? ` · NG+${S.ng}` : '');
  document.body.dataset.lv = level;
  document.body.classList.toggle('lv4', level >= 4);
  document.body.classList.toggle('lv6', level >= 6);
  document.querySelector('meta[name=theme-color]').content = `hsl(${(200 + level * 47 + S.ng * 97) % 360} 30% 6%)`;
  const r = autoRate(level);
  autoEl.textContent = r ? `+${fmt(r)} / s` : '';
  autoEl.classList.toggle('on', r > 0);
}
let shown = S.score, shownText = '';
function drawScore() { /* the frame loop eases the shown number toward S.score */ }
function tweenScore(dt) {
  const d = S.score - shown;
  if (Math.abs(d) < 1) shown = S.score;
  else if (d < 0) shown = S.score;
  else shown += d * Math.min(1, dt * 10);
  const t = fmt(shown); if (t !== shownText) { shownText = t; scoreEl.textContent = t; }
}

// ------------------------------------------------------------ canvas fx
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const [c, cx] of [[fx, ctx], [bg, bctx]]) {
    c.width = W * DPR; c.height = H * DPR;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
addEventListener('resize', resize); resize();

const parts = [], floats = [], rings = [], ribbons = [], labels = [];
// special words live in their own lane above the button, drawn over everything
function label(text, color = '#fff', size = 1) {
  const top = labels[labels.length - 1];
  if (top && top.text === text) { top.life = 1.3; top.born = performance.now(); top.y = H * 0.34; return; }   // same word again: refresh, don't stack
  for (const l of labels) l.y -= 38 * size;
  labels.push({ text, color, size, life: 1.3, y: H * 0.34, born: performance.now() });
  while (labels.length > 2) labels.shift();
}
function drawLabels(dt) {
  for (let i = labels.length - 1; i >= 0; i--) {
    const l = labels[i];
    l.life -= dt; if (l.life <= 0) { labels.splice(i, 1); continue; }
    l.y -= 18 * dt;
    const age = (performance.now() - l.born) / 1000, pop = age < 0.15 ? 1.35 - age * 2.3 : 1;
    ctx.save(); ctx.translate(W / 2, l.y); ctx.scale(pop, pop);
    ctx.globalAlpha = Math.min(1, l.life * 1.5);
    ctx.font = `900 ${Math.round(44 * l.size)}px -apple-system, system-ui, sans-serif`; ctx.textAlign = 'center';
    ctx.lineWidth = 9 * l.size; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(l.text, 0, 0);
    ctx.shadowColor = l.color; ctx.shadowBlur = 24; ctx.fillStyle = l.color; ctx.fillText(l.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function ripple(x, y, color) { rings.push({ x, y, r: 10, life: 1, color }); }
function confetti(x, y, n, power) {
  const cols = ['#ffd23f', '#ff5c8a', '#4de1ff', '#7dff6a', '#ffffff', '#c58bff'];
  for (let i = 0; i < n; i++) {

  floatNum(x, y - 40, '+' + fmt(gain), true);
  burst(x, y, 120, 700, '#ffd23f', 6); burst(x, y, 60, 500, '#fff', 4); confetti(x, y, 60, 500);
  doFlash(0.7, '#ffd23f'); shake(16, 0.5); sJackpot(); buzz([80, 40, 80, 40, 200]);
  startFrenzy(8);
  checkLevel(x, y); checkAch(); save();
}

// how close to the middle of the button: 1 in the centre, 0.3 at the rim, 0.1 outside
function accuracy(x, y) {
  const b = btn.getBoundingClientRect(), R = b.width / 2;
  if (!R) return 1;   // layout not ready (background tab): never divide by zero
  const d = Math.hypot(x - (b.left + R), y - (b.top + R)) / R;
  if (d > 1) return 0.1;
  if (d <= 0.3) return 1;
  return 1 - 0.7 * (d - 0.3) / 0.7;
}

let perfects = 0, critChain = 0, lastCrit = 0;
const COMBO_BONUS = { 100: 50, 200: 150, 500: 500, 1000: 1500 };
function tap(x, y) {
  const now = performance.now();
  let acc = accuracy(x, y); const inside = acc > 0.1;
  const b0 = btn.getBoundingClientRect();
  const perfect = inside && Math.hypot(x - (b0.left + b0.width / 2), y - (b0.top + b0.height / 2)) < b0.width * perfectR();
  perfects = perfect ? perfects + 1 : 0;
  if (perfect) acc = 1.5 + Math.min(perfects, 10) * 0.1;
  if (inside) { combo = now - lastTap < comboWin() ? combo + 1 : 1; lastTap = now; }
  if (inside && combo % 40 === 0) startFrenzy(5);
  const mult = Math.min(5, 1 + Math.floor(combo / 10)) * (inFrenzy() ? 3 : 1);
  const crit = inside && (now < critUntil || Math.random() < critChance());
  if (crit) { critChain = now - lastCrit < 600 ? Math.min(5, critChain + 1) : 1; lastCrit = now; }
  if (inside) { grooveTap(now); if (ev && ev.kind === 'rush') ev.taps++; }
  if (perfect) { targetFlash = 1; S.st.perfects = (S.st.perfects || 0) + 1; S.run.perfects++; }
  const gain = Math.max(1, Math.round(tapValue(level) * mult * (crit ? 10 * critChain : 1) * acc * (inside ? evMult() : 1) * (inside && groove >= 4 ? grooveMult() : 1)));
  S.score += gain;
  if (inside) { S.st.taps++; S.run.taps++; } if (crit) { S.st.crits++; S.run.crits++; } if (combo > S.st.maxCombo) S.st.maxCombo = combo; if (combo > S.run.maxCombo) S.run.maxCombo = combo;
  if (inside) {
    ripple(x, y, crit ? '#fff' : getComputedStyle(document.documentElement).getPropertyValue('--btn2'));
    comboWord();
    if (COMBO_BONUS[combo]) {
      const g = tapValue(level) * COMBO_BONUS[combo] * (inFrenzy() ? 3 : 1);
      S.score += g; drawScore();
      floatNum(W / 2, H * 0.42, '+' + fmt(g), true); burst(W / 2, H * 0.42, 60, 500, '#ffd23f', 5); confetti(W / 2, H * 0.42, 40, 450);
      doFlash(0.3, '#ffd23f'); shake(8, 0.3); sJackpot(); buzz([40, 30, 40, 30, 120]);
    }
    chord(x, y);
    if (S.st.taps % 1000 === 0) { goldenUntil = performance.now() + 20000; showBanner('✦', 'golden'); sOrb(); doFlash(0.5, '#ffd23f'); shake(10, 0.4); buzz([50, 30, 50, 30, 150]); }
    if (S.st.taps % 1000 === 0) {}
    else if (S.st.taps % 250 === 0 && !egg) dropEgg();
    else if (S.st.taps % 50 === 0) rollSlot();
  }

  drawScore();
  scoreEl.classList.add('bump'); setTimeout(() => scoreEl.classList.remove('bump'), 80);
  if (inside) {
    btn.classList.remove('crit', 'down'); void btn.offsetWidth;
    btn.classList.add(crit ? 'crit' : 'down');
    setTimeout(() => btn.classList.remove('down', 'crit'), crit ? 140 : 70);
  }

  const col = getComputedStyle(document.documentElement).getPropertyValue(crit ? '--btn2' : '--btn');
  if (crit) {
    floatNum(x, y - 30, '+' + fmt(gain), true);
    label(critChain > 1 ? `CRIT ×${critChain}` : 'CRIT', '#ff5c8a');
    if (critChain >= 5) slowMo(0.8);
    burst(x, y, 40, 450, '#fff', 4); burst(x, y, 30, 350, col, 6);
    doFlash(0.18, '#fff'); shake(8, 0.25); sCrit(critChain); buzz(40);
  } else if (perfect) {
    floatNum(x, y - 24, '+' + fmt(gain), false);
    label(perfects > 1 ? `PERFECT ×${perfects}` : 'PERFECT', '#ffd23f', 0.8);
    ripple(x, y, '#fff'); ripple(x, y, '#ffd23f');
    burst(x, y, 14, 300, '#fff', 3); shake(3, 0.08); sPerfect(perfects); buzz(12);
  } else if (!inside) {
    floats.push({ x: x + (Math.random() - .5) * 40, y: y - 16, text: '+' + fmt(gain), big: false, weak: true, life: 0.8, vy: -50 });
    tone(220, 0.05, 'triangle', 0.08);
  } else {
    floatNum(x, y - 20, '+' + fmt(gain), false);
    burst(x, y, (6 + Math.min(combo, 20) / 2) * acc, 220, col, 3);
    shake(2 * acc, 0.06); sTap(acc); buzz(8);
  }
  const total = mult * evMult() * (groove >= 4 ? grooveMult() : 1);
  if (combo >= 10 || total > 1) {
    comboEl.textContent = `×${total % 1 ? total.toFixed(1) : total}  ·  ${combo}`;
    comboEl.classList.add('on');
    comboEl.style.transform = 'scale(1.15)'; setTimeout(() => comboEl.style.transform = '', 90);
  } else comboEl.classList.remove('on');

  checkLevel(x, y); checkAch();
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 300);
}

// whole screen is the button; ignore the corner icons and the dialog
addEventListener('pointerdown', e => {
  if (e.target.closest('#ask')) return;
  if (orbPath && !locked) {
    const r = orb.getBoundingClientRect();
    if (Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) < 56) { e.preventDefault(); jackpot(e.clientX, e.clientY); return; }
  }
  if (e.target.closest('#corner')) return;
  e.preventDefault();
  if (locked) return;
  if (hitMeteor(e.clientX, e.clientY)) return;
  hitEgg(e.clientX, e.clientY);   // cracks the egg and still counts as a tap below
  if (e.target.closest('#score, #title')) { showStats(); return; }
  tap(e.clientX, e.clientY);
  if (locked) return;   // that tap just reached Absolute: no charge or rub into the transition
  rubs.set(e.pointerId, { x: e.clientX, y: e.clientY, dist: 0, shown: 0 });
  if (accuracy(e.clientX, e.clientY) > 0.1) chargeStart(e.pointerId);
}, { passive: false });
addEventListener('pointermove', e => rubMove(e.pointerId, e.clientX, e.clientY));
addEventListener('pointerup', e => { chargeEnd(e.pointerId, e.clientX, e.clientY); rubs.delete(e.pointerId); });
addEventListener('pointercancel', () => dropHeld());
addEventListener('blur', () => dropHeld());
addEventListener('touchstart', e => { if (!e.target.closest('#corner, #ask')) e.preventDefault(); }, { passive: false });
addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('dblclick', e => e.preventDefault());

// corner: mute, reset
const muteEl = $('mute');
const drawMute = () => { muteEl.textContent = S.muted ? '×' : '♪'; muteEl.style.opacity = S.muted ? .5 : 1; };
muteEl.addEventListener('click', () => { S.muted = !S.muted; if (S.muted) dropHeld(); drawMute(); save(); });
drawMute();
$('reset').addEventListener('click', () => $('ask').classList.add('show'));
$('askNo').addEventListener('click', () => $('ask').classList.remove('show'));
$('askYes').addEventListener('click', () => {
  if (locked) { $('ask').classList.remove('show'); return; }
  S.score = 0; level = 0; S.st = { taps: 0, crits: 0, jackpots: 0, charges: 0, maxCombo: 0, meteors: 0, days: S.st.days, bestDays: S.st.bestDays }; S.ach = [];
  S.ng = 0; S.runTime = 0; S.bestRun = 0; S.ok = 0; S.splits = []; S.run = { taps: 0, crits: 0, perfects: 0, maxCombo: 0, orbs: 0 };
  shown = 0; locked = false; toasts.length = 0; resetRuntime(); applyLevel(false); drawScore(); save();
  $('ask').classList.remove('show');
});

// income while the page was closed or in the background (rAF sleeps there)
function catchUp() {
  const r = autoRate(level); if (!r) return;
  const sec = Math.min(4 * 3600, Math.max(0, (Date.now() - (S.seen || Date.now())) / 1000));
  S.seen = Date.now();
  const g = Math.floor(r * sec);
  if (g < r * 5) return;
  S.score += g; drawScore(); checkLevel(W / 2, H * 0.28);
  setTimeout(() => { floatNum(W / 2, H * 0.28, '+' + fmt(g), true); burst(W / 2, H * 0.28, 30, 300, '#fff', 4); }, 400);
  save();
}
addEventListener('visibilitychange', () => {
  if (document.hidden) { dropHeld(); save(); }
  else { last = performance.now(); catchUp(); }
});
addEventListener('pagehide', save);

applyLevel(false); drawScore(); catchUp();

// stats card: tap the score, it shows for a moment
let statsTimer = 0;
function showStats(custom, ms = 3000) {
  const st = S.st;
  if (custom) {
    $('stats').innerHTML = custom.map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('');
    $('stats').classList.add('on'); clearTimeout(statsTimer); statsTimer = setTimeout(() => $('stats').classList.remove('on'), ms);
    return;
  }
  const rows = [['taps', fmt(st.taps)], ['crits', fmt(st.crits)], ['perfects', fmt(st.perfects || 0)], ['best combo', fmt(st.maxCombo)],
    ['gold', fmt(st.jackpots)], ['meteors', fmt(st.meteors || 0)], ['eggs', fmt(st.eggs || 0)], ['chords', fmt(st.chords || 0)], ['best groove', fmt(st.groove || 0)], ['best rush', fmt(st.rush || 0)], ['charges', fmt(st.charges)], ['rubbed', fmt(Math.round((st.rub || 0) / 100)) + ' m'],
    ['days', fmt(st.days || 1)], ['stars', fmt(S.ach.length) + ' / ' + ACH.length],
    ['cycle', 'NG+' + S.ng], ['this run', mmss(S.runTime)], ['best run', S.bestRun ? mmss(S.bestRun) : '—']];
  $('stats').innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('');
  $('stats').classList.add('on');
  tone(660, 0.1, 'triangle', 0.12);
  clearTimeout(statsTimer); statsTimer = setTimeout(() => $('stats').classList.remove('on'), 3000);
}

// a gift for every day you come back; days in a row count up
(function daily() {
  const d = new Date(), today = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  if (S.day === today) return;
  const y = new Date(d); y.setDate(d.getDate() - 1);
  const yest = `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`;
  const days = S.day === yest ? (S.st.days || 1) + 1 : 1;
  const gift = Math.max(50, (tapValue(level) * 200 + autoRate(level) * 600) * Math.min(days, 7));
  setTimeout(() => {
    S.st.days = days; S.st.bestDays = Math.max(S.st.bestDays || 0, days); S.day = today;   // written together with the gift, so closing early never eats the day
    S.score += gift; drawScore();
    showBanner('+' + fmt(gift), `day ${S.st.days}${S.st.days > 1 ? ' · ×' + Math.min(S.st.days, 7) : ''}`);
    burst(W / 2, H * 0.4, 120, 700, '#ffd23f', 5); burst(W / 2, H * 0.4, 80, 500, '#fff', 4); confetti(W / 2, H * 0.4, 100, 600);
    doFlash(0.4, '#ffd23f'); shake(10, 0.4); sJackpot(); buzz([60, 40, 60, 40, 120]);
    checkLevel(W / 2, H * 0.4); checkAch(); save();
  }, 700);
})();
